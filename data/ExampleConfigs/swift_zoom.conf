# Small SWIFT zoom with gas, a masked particle load, high-order PANPHASIA noise
# and a CLASS transfer function. Runs in about a minute on a laptop.
# See docs/quickstart.md. Run from the build directory:
#   ./MUSIC ../data/ExampleConfigs/swift_zoom.conf

[setup]
boxlength    = 50        # Mpc/h
zstart       = 127
levelmin     = 7         # 128^3 base grid; 2^(levelmin-1) must exceed sqrt(KK) = 32
levelmin_TF  = 8         # compute the transfer function one level finer than levelmin
levelmax     = 9         # 512^3 effective resolution in the zoom
padding      = 8
overlap      = 4
# box region; for a halo use region = ellipsoid / convex_hull with region_point_file
# (docs/refinement-regions.md)
ref_center   = 0.5, 0.5, 0.5
ref_extent   = 0.1, 0.1, 0.1
align_top    = no
baryons      = yes
use_2LPT     = yes
use_LLA      = no
ParticleLoad     = masked   # 7 DM : 1 gas in the zoom (docs/swift-output.md)
ParticleMaskType = 3

[cosmology]
Omega_m      = 0.3099      # Planck 2018 EE+BAO+SN
Omega_b      = 0.048891054
Omega_L      = 0.6901
H0           = 67.742
sigma_8      = 0.8102
n_s          = 0.96822
transfer     = CLASS
ztarget      = 0.0         # redshift at which sigma_8 is matched

[random]
generator  = PANPHASIA
descriptor = [Panph6,L18,(56034,71400,250000),S1,KK1025,CH3774755196,Flamingo_Gpc1]

[poisson]
fft_fine      = yes
accuracy      = 1e-5
grad_order    = 6
laplace_order = 6

[output]
format          = swift
filename        = ics_swift_zoom.hdf5
top_level_cells = 16
